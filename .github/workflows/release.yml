name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Прогон после commit-back не должен снова версионировать/публиковать
      - name: Detect pending changesets
        id: pending
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & verify library styles
        if: steps.pending.outputs.yes == 'true' && env.NPM_TOKEN != ''
        run: pnpm --filter @sergeyhorse/forge build:verify

      - name: Version, publish and push the bump
        if: steps.pending.outputs.yes == 'true' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          pnpm changeset publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:main
          # changeset ставит легковесные теги, --follow-tags их не видит
          git push origin --tags
