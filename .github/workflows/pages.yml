name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs & storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # docs резолвят @sergeyhorse/forge через exports, то есть из собранного dist
      - name: Build library
        run: pnpm --filter @sergeyhorse/forge build

      - name: Build docs
        run: pnpm --filter docs build

      - name: Build storybook
        run: pnpm --filter forge-storybook build

      - name: Assemble site
        run: |
          mkdir -p apps/docs/dist/storybook
          cp -r apps/storybook/storybook-static/. apps/docs/dist/storybook/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
